<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Compras - Preparar Lista</title>
    <link rel="manifest" href="/app/js/manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon.png">
    <link rel="stylesheet" href="./fonts/material-symbols.css">
    <link rel="stylesheet" href="./vendor/animate-4.1.1.min.css">
    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>
    <div class="header">
        <div>
            <a href="/app/home.html">
                <i class="material-symbols-outlined">arrow_back</i>
            </a>
        </div>

        <div class="titles">
            <h1>Preparar Lista de Compras</h1>
        </div>

        <div>
            <a onclick="decFontSize()">
                <i class="material-symbols-outlined"> text_decrease </i>
            </a>
            <a onclick="incFontSize()">
                <i class="material-symbols-outlined"> text_increase </i>
            </a>
        </div>
    </div>
    
    <div id="pesquisa">
        <div class="w-100">
            <input id="pesquisa-lista" class="pesquisa-lista" type="search"
                placeholder="Pesquisar itens (mín. 3 caracteres)" autocomplete="off">
        </div>
    </div>

    <div class="container">

        <!-- <div class="titles">
            <h1>Preparar Lista de Compras</h1>
        </div> -->

        <div class="content" hx-ext="client-side-templates">
            <!-- <div class="w-100">
                <input id="pesquisa-lista" class="pesquisa-lista" type="search"
                    placeholder="Pesquisar itens (mín. 3 caracteres)" autocomplete="off">
            </div> -->
            <div id="lista" class="w-100" hx-get="/api/lista" hx-trigger="load" hx-swap="innerHTML"
                mustache-array-template="template">
                <!-- Os dados vão ser exibidos aqui. -->

                <div class="spinner">
                    <img src="./icons/spinner.svg">
                </div>
            </div>

            <template id="template">
                <section id="itens">
                    <table>
                        <thead>
                            <tr>
                                <th>Nome do item</th>
                                <th class="m-hidden">Categoria</th>
                                <th class="m-hidden">Situação</th>
                                <th>&nbsp;</th>
                            </tr>
                        </thead>

                        <tbody>
                            <!-- {{#data}} -->
                            <!-- {{#selecionados}} -->
                            <tr>
                                <td title="{{id}}" class="success u-case">{{nome}}</td>
                                <td data-th="Categoria" class="success m-hidden fl-case">{{categoria}}</td>
                                <td data-th="Situação" class="success m-hidden fl-case">{{status}}</td>
                                <td>
                                    <div class="icon">
                                        <a title="Excluir este item da lista" hx-target="closest table"
                                            hx-swap="outerHTML" hx-patch="/api/lista/{{id}}/remover">
                                            <i class="material-symbols-outlined small-icon warning">playlist_remove</i>
                                        </a>
                                    </div>
                                </td>
                            </tr>
                            <!-- {{/selecionados}} -->

                            <!-- {{#comprados}} -->
                            <tr>
                                <td title="{{id}}" class="u-case">{{nome}}</td>
                                <td data-th="Categoria" class="m-hidden fl-case">{{categoria}}</td>
                                <td data-th="Situação" class="m-hidden fl-case">{{status}}</td>
                                <td class="icon">
                                    <div class="icon">
                                        <a title="Adicionar este item à lista" hx-target="closest table"
                                            hx-swap="outerHTML" hx-patch="/api/lista/{{id}}/adicionar">
                                            <i class="material-symbols-outlined small-icon success">playlist_add</i>
                                        </a>
                                    </div>
                                </td>
                            </tr>
                            <!-- {{/comprados}} -->


                            <!-- {{#cadastrados}} -->
                            <tr>
                                <td title="{{id}}" class="u-case">{{nome}}</td>
                                <td data-th="Categoria" class="m-hidden fl-case">{{categoria}}</td>
                                <td data-th="Situação" class="m-hidden fl-case">{{status}}</td>
                                <td class="icon">
                                    <div class="icon">
                                        <a title="Adicionar este item à lista" hx-target="closest table"
                                            hx-swap="outerHTML" hx-patch="/api/lista/{{id}}/adicionar">
                                            <i class="material-symbols-outlined small-icon success">playlist_add</i>
                                        </a>
                                    </div>
                                </td>
                            </tr>
                            <!-- {{/cadastrados}} -->

                            <!-- {{^cadastrados}} -->
                            <tr>
                                <td class="warning" colspan="5">Não há itens para colocar na lista.</td>
                            </tr>
                            <!-- {{/cadastrados}} -->
                            <!-- {{/data}} -->
                        </tbody>
                    </table>

                </section>
            </template>

            <div class="buttons spacer" hx-ext="client-side-templates">
                <a class="button" hx-target="previous #lista" hx-trigger="click" hx-confirm="os itens selecionados"
                    mustache-array-template="template" hx-get="/api/lista/all/reset">
                    Nova lista
                </a>
                <a class="button" href="/app/compras.html">Fazer compras</a>
            </div>

            <div class="floating-buttons" hx-ext="client-side-templates">
                <div>
                    <button class="fab" id="toggle-pesquisa">
                        <i class="material-symbols-outlined">search</i>
                    </button>
                    <legend>PESQUISAR</legend>
                </div>
                <div>
                    <button class="fab" hx-target="previous #lista" hx-trigger="click"
                        hx-confirm="os itens selecionados" mustache-array-template="template"
                        hx-get="/api/lista/all/reset">
                        <i class="material-symbols-outlined">playlist_remove</i>
                    </button>
                    <legend>NOVA LISTA</legend>
                </div>
                <div>
                    <a class="fab" href="/app/compras.html" title="Fazer as compras">
                        <i class="material-symbols-outlined">shopping_cart</i>
                    </a>
                    <legend>FAZER COMPRAS</legend>
                </div>
            </div>

            <div id="toast" class="animate__animated animate__faster">
                <!-- Exibir mensagem de erro -->
            </div>
        </div>
    </div>

    <script src="./vendor/htmx-1.9.10.js"></script>
    <script src="./vendor/htmx-client-side-templates.js"></script>
    <script src="./vendor/htmx-response-targets.js"></script>
    <script src="./vendor/mustache-4.2.0.js"></script>
    <script src="./vendor/sweetalert2-11.26.25.js"></script>
    <script src="./js/functions.js"></script>
    <script src="./js/auth.js?v=2"></script>

</body>

</html>
