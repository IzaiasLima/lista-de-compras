<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon.png">
    <title>Lista de Compras - Login</title>
    <link rel="stylesheet"
        href="./fonts/material-symbols.css">
    <link rel="stylesheet" href="./vendor/animate-4.1.1.min.css">
    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>
    <div class="header">
        <a href="/app/home.html">
            <i class="material-symbols-outlined">arrow_back</i>
        </a>
        <span>&nbsp;</span>
    </div>

    <div class="container">
        <div id="login">
            <input type="password" name="oldpwd" placeholder="Senha anterior">
            <input type="password" name="newpwd" placeholder="Nova senha">

            <a class="button" hx-target="this" hx-post="/newpwd" hx-include="#login">Trocar a senha</a>
        </div>

        <div id="toast" class="animate__animated animate__faster">
            <!-- Exibir mensagem de erro -->
        </div>
    </div>

    <script src="./vendor/htmx-1.9.10.js"></script>
    <script src="./js/functions.js"></script>
    <script src="./js/auth.js?v=2"></script>

</body>

</html>
