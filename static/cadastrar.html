<!DOCTYPE html>
<html lang="pt-BR">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Lista de Compras - Cadastro de Produtos</title>
        <link rel="manifest" href="/app/js/manifest.json">
        <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon.png">
        <link rel="stylesheet"
            href="./fonts/material-symbols.css">
        <link rel="stylesheet" href="./vendor/animate-4.1.1.min.css">
        <link rel="stylesheet" href="./css/styles.css">
    </head>

    <body>
        <div class="header">
            <a href="/app/home.html">
                <i class="material-symbols-outlined">arrow_back</i>
            </a>
            <div>
                <a onclick="decFontSize()">
                    <i class="material-symbols-outlined"> text_decrease </i>
                </a>
                <a onclick="incFontSize()">
                    <i class="material-symbols-outlined"> text_increase </i>
                </a>
            </div>
        </div>

        <div class="container">

            <div class="titles">
                <h1>Cadastro de Produtos</h1>
            </div>

            <div class="content" hx-ext="client-side-templates">
                <span>Lista geral dos produtos. Inclua apenas os itens que você compra regularmente.
                    Exclua aqueles que você raramente compra.</span>
                <div class="w-100" hx-get="/api/itens" hx-trigger="load" hx-swap="innerHTML"
                    mustache-array-template="template">
                    <!-- Os dados vão ser exibidos aqui. -->

                    <div class="spinner">
                        <img src="./icons/spinner.svg">
                    </div>
                </div>

                <template id="template">
                    <section id="itens">
                        <table>
                            <thead>
                                <tr>
                                    <th>Nome do produto</th>
                                    <th class="m-hidden">Categoria</th>
                                    <th class="m-hidden">Situação</th>
                                    <th>&nbsp;</th>
                                </tr>
                            </thead>

                            <tbody>
                                <!-- {{#data}} -->
                                <tr>
                                    <td title="{{id}}" class="u-case">{{nome}}</td>
                                    <td data-th="Categoria" class="m-hidden fl-case">{{categoria}}</td>
                                    <td data-th="Situação" class="m-hidden fl-case">{{status}}</td>
                                    <td class="icon">
                                        <div>
                                            <a title="Excluir este item do cadastro" hx-target="closest tr"
                                                hx-swap="outerHTML swap:0.5s" hx-confirm="{{nome}}"
                                                hx-delete="/api/itens/{{id}}">
                                                <i class="material-symbols-outlined small-icon warning">delete</i>
                                            </a>
                                        </div>
                                    </td>
                                </tr>

                                <!-- {{/data}} -->

                                <!-- {{^data}} -->
                                <tr>
                                    <td class="warning" colspan="5">Não há itens cadastrados.</td>
                                </tr>
                                <!-- {{/data}} -->
                            </tbody>
                        </table>

                        <div>
                            <div class="buttons spacer" hx-ext="client-side-templates">
                                <button hx-trigger="click" hx-get="/api/itens/new/add" hx-target="#itens"
                                    hx-swap="innerHTML">
                                    <span>Cadastrar um Produto</span>
                                </button>
                                <a class="button" href="/app/lista.html">Preparar a lista de compras</a>
                            </div>
                        </div>

                        <div class="floating-buttons">
                            <div>
                                <button class="fab" title="Cadastrar um Produto" hx-trigger="click"
                                    hx-get="/api/itens/new/add" hx-target="#itens" hx-swap="innerHTML">
                                    <i class="material-symbols-outlined">add</i>
                                </button>
                                <legend>NOVO PRODUTO</legend>
                            </div>

                            <div>
                                <a class="fab" href="/app/lista.html" title="Preparar a lista de compras">
                                    <i class="material-symbols-outlined">list_alt_add</i>
                                </a>
                                <legend>PREPARAR LISTA</legend>
                            </div>
                        </div>
                    </section>
                </template>

                <div id="toast" class="animate__animated animate__faster">
                    <!-- Exibir mensagem de erro -->
                </div>
            </div>
        </div>

        <script src="./vendor/htmx-1.9.10.js"></script>
        <script src="./vendor/htmx-client-side-templates.js"></script>
        <script src="./vendor/mustache-4.2.0.js"></script>
        <script src="./vendor/sweetalert2-11.26.25.js"></script>
        <script src="./js/functions.js"></script>
        <script src="./js/auth.js?v=2"></script>

    </body>

</html>
