<!DOCTYPE html>
<html lang="pt-BR">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon.png">
        <title>Lista de Compras - Login</title>
        <link rel="manifest" href="/app/js/manifest.json">
        <link rel="stylesheet"
            href="./fonts/material-symbols.css">
        <link rel="stylesheet" href="./vendor/animate-4.1.1.min.css">
        <link rel="stylesheet" href="./css/styles.css">
    </head>

    <body>
        <div class="container">

            <div id="login">

                <div class="spinner hide">
                    <img src="./icons/spinner.svg">
                </div>

                <input type="text" name="user" placeholder="Usuário">
                <input type="password" name="passwd" placeholder="Senha">

                <button hx-target="this" hx-post="/login" hx-include="#login" hx-indicator="#loader">
                    <img width="70px" id="loader" class="htmx-indicator" src="./icons/loader.svg">
                    <span>Entrar</span>
                </button>

                <div class="buttons">
                    <button class="mini secondary" onclick="showToast('Envie e-mail para suporte@izaias.dev')">Esqueci a
                        senha</button>
                    <button class="mini secondary" hx-target="this" hx-post="/newuser" onclick="showSpinner()"
                        hx-include="#login">Cadastrar</button>
                </div>
            </div>

            <div id="toast" class="animate__animated animate__faster">
                <!-- Exibir mensagem de erro -->
            </div>
        </div>

        <script src="./vendor/htmx-1.9.10.js"></script>
        <script src="./js/functions.js"></script>

    </body>

</html>
